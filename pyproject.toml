[project]
name = "rothbart-lab-betagal-quantification"
version = "0.1.0"
description = "Counting cells in beta-galactisidase stains"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bioio>=3.4.0",
    "bioio-czi>=2.8.0",
    "cellpose>=4.2.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "oic-toolkit",
    "opencv-python>=5.0.0.93",
    "pylibczirw>=6.1.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared"
module-root = ""

[tool.uv.sources]
oic-toolkit = { path = "../../Toolboxes/oic-toolkit", editable = true }
